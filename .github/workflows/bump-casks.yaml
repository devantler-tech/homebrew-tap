name: 🍺 Bump Casks

# The tap is the only writer of Cask versions (#2568). Every hour, Homebrew's own livecheck finds
# each Cask's latest GitHub release, and scripts/bump-casks.sh groups the KSail CLI and desktop
# into one update, leaving other Casks independent. `brew bump-cask-pr` computes every checksum.
# GitHub's latest release never points at a draft or a prerelease,
# so a Cask cannot move to an unpublished release or an older tag.

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: bump-casks
  cancel-in-progress: false

jobs:
  bump:
    name: Open release-consistent Cask updates
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read # writes use the App token minted below, never the job token
      id-token: write # proves this job to the GitHub token broker (devantler-tech/monorepo ADR 0020)
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: 🔑 Generate GitHub App Token
        # An App token, not GITHUB_TOKEN, so the opened pull request starts the tap's CI.
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: generate-token
        with:
          domain: sts.platform.devantler.tech
          scope: devantler-tech/homebrew-tap
          identity: bump-casks
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ⬆️ Update Homebrew
        run: brew update --quiet
      - name: 🍺 Tap and trust this tap
        # Homebrew refuses to load Casks from an untrusted tap.
        run: |
          set -euo pipefail
          brew tap devantler-tech/tap
          brew trust --tap devantler-tech/tap
      - name: ⬆️ Bump outdated Casks
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.generate-token.outputs.token }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: bash scripts/bump-casks.sh "$GITHUB_REPOSITORY" devantler-tech/tap
