name: "TODOs"
permissions:
  contents: read
  issues: write
  id-token: write # lets the shared to-do scanner prove its identity to the GitHub token broker (ADR 0020)
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  todos:
    uses: devantler-tech/.github/.github/workflows/scan-for-todo-comments.yaml@d45338f0ba120e87bdb05c1f70691afe2ec9d2ca # v22.7.5
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
