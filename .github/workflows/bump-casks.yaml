name: 🍺 Bump Casks

# The tap is the only writer of Cask versions (#2568). Every hour, Homebrew's own livecheck finds
# each Cask's latest GitHub release, and scripts/bump-casks.sh opens one pull request per outdated
# Cask with `brew bump-cask-pr`. GitHub's latest release never points at a draft or a prerelease,
# so a Cask cannot move to an unpublished release or an older tag.

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: bump-casks
  cancel-in-progress: false

jobs:
  bump:
    name: Open a pull request for each outdated Cask
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read # writes use the App token minted below, never the job token
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 🔑 Generate GitHub App Token
        # An App token, not GITHUB_TOKEN, so the opened pull request starts the tap's CI.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env] - GitHub App token generation, no environment scoping available for app installations
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ⬆️ Update Homebrew
        run: brew update --quiet
      - name: 🍺 Tap and trust this tap
        # Homebrew refuses to load Casks from an untrusted tap.
        run: |
          set -euo pipefail
          brew tap devantler-tech/tap
          brew trust --tap devantler-tech/tap
      - name: ⬆️ Bump outdated Casks
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.generate-token.outputs.token }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: bash scripts/bump-casks.sh "$GITHUB_REPOSITORY" devantler-tech/tap
