---
name: Cask Style Drift

# The pull-request style gate checks only the Casks a change touches (#1556), so a Cask can drift
# out of `brew style` without any change to it: macos-latest ships Homebrew's bundled RuboCop, and a
# newer runner image can add a cop an existing Cask does not satisfy. This checks every Cask on main
# after each merge and daily, and keeps one issue open while any Cask fails.
on:
  push:
    branches: [main]
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cask-style-drift
  cancel-in-progress: false

jobs:
  style:
    name: 🎨 Style every Cask on main
    runs-on: macos-latest
    permissions:
      contents: read # checkout
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # brew style is offline; audit matches the repo's other jobs
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # read-only job; never pushes
      - name: 🎨 brew style (every Cask)
        run: brew style ./Casks/

  report:
    name: Report style drift
    needs: [style]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write # open, update, or close the drift tracking issue
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: 📣 Open or update the drift issue
        if: needs.style.result != 'success'
        uses: devantler-tech/actions/upsert-issue@da153eb43b8333f13094abb151a48dc11e431988 # v13.7.4
        with:
          title: "A Cask on main is not brew style-clean"
          body: |
            `brew style ./Casks/` failed on `main`. Pull requests only style-check the Casks they change, so this is either a new cop on the macOS runner image flagging a Cask nobody touched, or a Cask that reached `main` without passing the gate.

            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Result: `${{ needs.style.result }}`

            Run `brew style --fix` on the Casks the run names and commit the result in a pull request. The fix is a reorder or reformat only; review that version, URL and checksum are unchanged. This issue is updated by every failing run and closed by the next passing one.
      - name: ✅ Close the drift issue
        if: needs.style.result == 'success'
        uses: devantler-tech/actions/upsert-issue@da153eb43b8333f13094abb151a48dc11e431988 # v13.7.4
        with:
          title: "A Cask on main is not brew style-clean"
          open: "false"
          body: "Every Cask on main is brew style-clean."
          close-comment: "✅ ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} passed on `main`, so every Cask is style-clean again. Closing."
